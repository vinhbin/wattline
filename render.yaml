# API web service + React static site. (The Workflow service is created via
# the Dashboard — Blueprints don't support the Workflow type yet. See
# workflows/main.py.)
services:
  - type: web
    name: wattline-api
    runtime: python
    plan: free
    region: ohio
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

  - type: web
    name: wattline-web
    runtime: static
    # no region — static sites are served from Render's global CDN and the
    # blueprint is rejected outright if you give them one.
    autoDeploy: true
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    routes:
      # web/src/api.js fetches relative /api/* — proxy those to the API
      # service so the frontend needs no build-time base URL.
      # ⚠️ If Render assigns the API a suffixed host (name collision), the
      # destination below must be updated to the real .onrender.com URL.
      - type: rewrite
        source: /api/*
        destination: https://wattline-api.onrender.com/api/*
      # SPA fallback — must stay last, it matches everything.
      - type: rewrite
        source: /*
        destination: /index.html
